<body><div class="app"><aside class="sidebar"><a class="brand" href="#home"><span class="seal">茶</span><span>德昂茶语<small>DE'ANG TEA MEMORY</small></span></a><p class="side-note">一片茶叶，一座记忆之林。</p><nav id="side-nav"></nav><div class="side-bottom"><span class="tiny">茶林记忆 · 数字知识库</span><p>让每一次提问<br>都成为一次传承。</p><button class="text-btn" data-page="studio">进入影像工作台 ↗</button></div></aside><main id="main"></main><nav class="bottom-nav" id="bottom-nav" aria-label="主导航"></nav></div><dialog id="detail"><button class="close" aria-label="关闭弹窗">×</button><div id="detail-content"></div></dialog><div id="toast" role="status"></div><script>const TEA_DATA={"records":[{"id":"001","category":"德昂酸茶是什么","topic":"基础定义","question":"德昂酸茶是什么？","answer":"德昂酸茶是德昂族传统制茶技艺的重要代表，以云南大叶种鲜叶为原料，通过传统密封、发酵等工艺制作形成的特色茶品。它不仅是一种饮品，也是德昂族茶文化的重要组成部分。","type":"基础知识","origin":"已有资料/PPT","mediaNeeds":"酸茶图片、成品照片","status":"已有","source":"德昂酸茶AI知识库采集表_V1.0.xlsx · AI知识问答库 · 第2行","published":true},{"id":"002","category":"德昂酸茶是什么","topic":"为什么叫德昂酸茶","question":"为什么叫德昂酸茶？","answer":"名称与发酵形成的酸味有关。研究认为，乳酸、乙酸可能参与酸香与酸甜滋味的形成。","type":"资料整理","origin":"公开资料整理","mediaNeeds":"茶汤图片","status":"已有","source":"云南省农业科学院机构知识库 · 不同容器发酵过程中德昂族酸茶主要营养成分变化分析（2024）","published":true,"originalQuestion":"为什么叫德昂酸茶？","originalAnswer":"德昂酸茶因制作过程中经历传统发酵过程，形成独特酸香风味，因此被称为酸茶。","originalStatus":"待补充","originalSource":"德昂酸茶AI知识库采集表_V1.0.xlsx · AI知识问答库 · 第3行","updatedAt":"2026-09-10","references":[{"id":"chem","publisher":"云南省农业科学院机构知识库","title":"不同容器发酵过程中德昂族酸茶主要营养成分变化分析（2024）","url":"https://yunnan.agriir.cn/resources/detail/1/074D623C-FFA7-45F2-BB21-896AF86101F6.html?projectId=405d92be-2997-11e7-b5f5-3440b5b17484","checkedAt":"2026-09-10"}]},{"id":"003","category":"德昂酸茶是什么","topic":"分类","question":"德昂酸茶有哪些类型？","answer":"根据用途不同，德昂酸茶可分为食用茶和饮用茶。食用茶通常发酵时间较短，饮用茶经过进一步加工后用于冲泡。","type":"基础知识","origin":"已有资料/PPT","mediaNeeds":"湿茶、干茶图片","status":"已有","source":"德昂酸茶AI知识库采集表_V1.0.xlsx · AI知识问答库 · 第4行","published":true},{"id":"004","category":"原料与采摘","topic":"茶叶原料","question":"制作酸茶需要什么原料？","answer":"德昂酸茶主要使用云南大叶种茶树鲜叶作为原料，大叶种茶叶丰富的内含物质为发酵和风味形成提供基础。","type":"原料知识","origin":"已有资料/PPT","mediaNeeds":"茶园、鲜叶图片","status":"已有","source":"德昂酸茶AI知识库采集表_V1.0.xlsx · AI知识问答库 · 第5行","published":true},{"id":"005","category":"原料与采摘","topic":"酸茶采摘有什么要求","question":"酸茶采摘有什么要求？","answer":"鲜叶标准存在做法差异。2019年杨腊三报道提到其偏好芽尖的一对叶子，不能据此认定所有酸茶均采用相同嫩度。","type":"资料整理","origin":"公开资料整理","mediaNeeds":"采茶视频","status":"已有","source":"国家民族事务委员会 / 民族画报 · 杨腊三人物报道（2019-09-27）","published":true,"originalQuestion":"酸茶采摘有什么要求？","originalAnswer":"传统制作通常选择嫩度适中的鲜叶，以保证后续加工和发酵效果。","originalStatus":"待补充","originalSource":"德昂酸茶AI知识库采集表_V1.0.xlsx · AI知识问答库 · 第6行","updatedAt":"2026-09-10","references":[{"id":"yangstory","publisher":"国家民族事务委员会 / 民族画报","title":"杨腊三人物报道（2019-09-27）","url":"https://www.neac.gov.cn/seac/c102859/201909/1137133.shtml","checkedAt":"2026-09-10"}]},{"id":"006","category":"传统制作工艺","topic":"流程概览","question":"德昂酸茶制作有哪些步骤？","answer":"传统制作流程包括采摘、晾晒、蒸茶、揉捻、装竹筒、密封、埋土发酵、出筒、晒干等环节。","type":"工艺知识","origin":"已有资料/PPT","mediaNeeds":"完整制作流程视频","status":"已有","source":"德昂酸茶AI知识库采集表_V1.0.xlsx · AI知识问答库 · 第7行","published":true},{"id":"007","category":"传统制作工艺","topic":"为什么需要晾晒","question":"为什么需要晾晒？","answer":"公开课记载，鲜叶采后摊放，避免直晒；蒸后再摊凉至适温。二者不能与成品干燥混为一谈。","type":"资料整理","origin":"公开资料整理","mediaNeeds":"萎凋照片视频","status":"已有","source":"云南省非物质文化遗产保护中心 · 云南非遗公开课（2023-10-27）","published":true,"originalQuestion":"为什么需要晾晒？","originalAnswer":"晾晒可以使鲜叶适当失水，改变叶片状态，为后续加工创造条件。","originalStatus":"待补充","originalSource":"德昂酸茶AI知识库采集表_V1.0.xlsx · AI知识问答库 · 第8行","updatedAt":"2026-09-10","references":[{"id":"class","publisher":"云南省非物质文化遗产保护中心","title":"云南非遗公开课（2023-10-27）","url":"https://www.ynich.cn/special/openclass/3392.html","checkedAt":"2026-09-10"}]},{"id":"008","category":"传统制作工艺","topic":"蒸茶在制作中起什么作用","question":"蒸茶在制作中起什么作用？","answer":"公开工艺将这一环节称为蒸茶杀青，位于揉茶之前。具体温度和时长应核实到实际工艺。","type":"资料整理","origin":"公开资料整理","mediaNeeds":"蒸茶视频","status":"已有","source":"云南省非物质文化遗产保护中心 · 云南非遗公开课（2023-10-27）","published":true,"originalQuestion":"蒸茶有什么作用？","originalAnswer":"蒸茶是传统制作的重要步骤，通过蒸制改变茶叶状态，为后续揉捻和发酵做好准备。","originalStatus":"待补充","originalSource":"德昂酸茶AI知识库采集表_V1.0.xlsx · AI知识问答库 · 第9行","updatedAt":"2026-09-10","references":[{"id":"class","publisher":"云南省非物质文化遗产保护中心","title":"云南非遗公开课（2023-10-27）","url":"https://www.ynich.cn/special/openclass/3392.html","checkedAt":"2026-09-10"}]},{"id":"009","category":"传统制作工艺","topic":"揉捻在酸茶工序中的位置是什么","question":"揉捻在酸茶工序中的位置是什么？","answer":"蒸茶后先摊凉，再揉茶，随后装入容器压紧。手法与揉捻程度需现场记录。","type":"资料整理","origin":"公开资料整理","mediaNeeds":"揉捻过程视频","status":"已有","source":"云南省非物质文化遗产保护中心 · 云南非遗公开课（2023-10-27）","published":true,"originalQuestion":"揉捻有什么作用？","originalAnswer":"揉捻可以促进茶汁释放，使茶叶结构发生变化，有利于后续发酵。","originalStatus":"待补充","originalSource":"德昂酸茶AI知识库采集表_V1.0.xlsx · AI知识问答库 · 第10行","updatedAt":"2026-09-10","references":[{"id":"class","publisher":"云南省非物质文化遗产保护中心","title":"云南非遗公开课（2023-10-27）","url":"https://www.ynich.cn/special/openclass/3392.html","checkedAt":"2026-09-10"}]},{"id":"010","category":"传统制作工艺","topic":"传统酸茶用什么容器发酵","question":"传统酸茶用什么容器发酵？","answer":"公开资料记载使用竹筒或竹筐，装茶后压紧、封口；并非只存在一种容器形式。","type":"资料整理","origin":"公开资料整理","mediaNeeds":"竹筒图片视频","status":"已有","source":"云南省农业农村厅 · 德昂族酸茶制作技艺（2025-04-07）","published":true,"originalQuestion":"为什么使用竹筒保存？","originalAnswer":"竹筒是传统酸茶制作中的重要容器，与当地环境和传统工艺相结合，有助于形成独特风味。","originalStatus":"待补充","originalSource":"德昂酸茶AI知识库采集表_V1.0.xlsx · AI知识问答库 · 第11行","updatedAt":"2026-09-10","references":[{"id":"agri","publisher":"云南省农业农村厅","title":"德昂族酸茶制作技艺（2025-04-07）","url":"https://nync.yn.gov.cn/html/2025/yzycfycj_0407/1418142.html","checkedAt":"2026-09-10"}]},{"id":"011","category":"发酵知识","topic":"为什么酸茶需要发酵","question":"为什么酸茶需要发酵？","answer":"发酵中的微生物作用使茶叶成分发生变化，形成区别于鲜叶的香气与滋味。","type":"资料整理","origin":"公开资料整理","mediaNeeds":"发酵过程视频","status":"已有","source":"云南省委宣传部网站 · 德昂族酸茶：茶叶与时光的对话（2025-07-25）","published":true,"originalQuestion":"为什么酸茶需要发酵？","originalAnswer":"发酵是形成酸茶特殊风味的重要过程，使茶叶产生独特的香气和口感。","originalStatus":"待补充","originalSource":"德昂酸茶AI知识库采集表_V1.0.xlsx · AI知识问答库 · 第12行","updatedAt":"2026-09-10","references":[{"id":"time","publisher":"云南省委宣传部网站","title":"德昂族酸茶：茶叶与时光的对话（2025-07-25）","url":"https://www.ynxc.gov.cn/html/2025/wenwuhewenhuayichanbaohuzuoyong_0725/3026721.html","checkedAt":"2026-09-10"}]},{"id":"012","category":"发酵知识","topic":"为什么把竹筒埋土发酵","question":"为什么把竹筒埋土发酵？","answer":"埋土是传统发酵做法之一。公开资料也记载地窖发酵，不能把埋土理解为唯一工艺。","type":"资料整理","origin":"公开资料整理","mediaNeeds":"埋土视频","status":"已有","source":"云南省非物质文化遗产保护中心 · 云南非遗公开课（2023-10-27）","published":true,"originalQuestion":"为什么要埋土发酵？","originalAnswer":"传统工艺中将密封后的竹筒埋入土中，通过自然环境完成发酵过程。","originalStatus":"重点采访","originalSource":"德昂酸茶AI知识库采集表_V1.0.xlsx · AI知识问答库 · 第13行","updatedAt":"2026-09-10","references":[{"id":"class","publisher":"云南省非物质文化遗产保护中心","title":"云南非遗公开课（2023-10-27）","url":"https://www.ynich.cn/special/openclass/3392.html","checkedAt":"2026-09-10"}]},{"id":"013","category":"冲泡与饮用","topic":"口感特点","question":"德昂酸茶有什么特点？","answer":"冲泡后的酸茶具有独特酸香，入口微酸并伴随回甘，具有较强地域特色。","type":"品鉴知识","origin":"已有资料","mediaNeeds":"冲泡视频、茶汤图片","status":"已有","source":"德昂酸茶AI知识库采集表_V1.0.xlsx · AI知识问答库 · 第14行","published":true},{"id":"014","category":"德昂族文化","topic":"为什么说茶是德昂族的根","question":"为什么说茶是德昂族的根？","answer":"公开文化介绍把茶与民族起源观念、茶树崇拜及生活礼俗相联系。“根”表达文化认同，而非生物学关系。","type":"资料整理","origin":"公开资料整理","mediaNeeds":"民族文化影像","status":"已有","source":"云南省委宣传部网站 · 德昂族酸茶：茶叶与时光的对话（2025-07-25）","published":true,"originalQuestion":"为什么说茶是德昂族的根？","originalAnswer":"茶在德昂族历史、生活和文化中具有重要地位，与民族起源、生活习俗和精神文化紧密相关。","originalStatus":"待补充","originalSource":"德昂酸茶AI知识库采集表_V1.0.xlsx · AI知识问答库 · 第15行","updatedAt":"2026-09-10","references":[{"id":"time","publisher":"云南省委宣传部网站","title":"德昂族酸茶：茶叶与时光的对话（2025-07-25）","url":"https://www.ynxc.gov.cn/html/2025/wenwuhewenhuayichanbaohuzuoyong_0725/3026721.html","checkedAt":"2026-09-10"}]},{"id":"015","category":"传承人口述","topic":"传承人怎样凭经验判断发酵成熟","question":"传承人怎样凭经验判断发酵成熟？","answer":"根据用户提供的《酸茶docx.docx》：资料描述传承人综合气味、色泽与滋味等感官经验判断发酵成熟。这是传统经验的记录，文档没有提供可用于判定食品安全或批次合格的检测依据。","type":"用户补充资料","origin":"尚需真实采访或检测记录","mediaNeeds":"记录具体传承人的判断依据、批次条件和原话，并与检测结果核对。","status":"已有","source":"用户提供《酸茶docx.docx》第3项（未署名，未注明采集日期）","published":true,"originalQuestion":"传统酸茶制作中哪些经验无法记录？","originalAnswer":"许多制茶经验依靠长期实践积累，例如判断茶叶状态、发酵程度等，需要通过传承人口述和实践学习获得。","originalStatus":"待采集","originalSource":"德昂酸茶AI知识库采集表_V1.0.xlsx · AI知识问答库 · 第16行","updatedAt":"2026-09-11","references":[],"supplement":{"document":"酸茶docx.docx","section":3,"receivedAt":"2026-09-11","verification":"用户提供的经验资料，未独立核验"}},{"id":"016","category":"基础知识","topic":"德昂酸茶主要流传在哪里","question":"德昂酸茶主要流传在哪里？","answer":"主要流传于云南省德宏州芒市。","type":"资料整理","origin":"公开资料整理","mediaNeeds":"图片/视频/音频","status":"已有","source":"中国非物质文化遗产网 · 德昂族酸茶制作技艺","published":true,"originalQuestion":"特点相关知识问题1","originalAnswer":"关于德昂酸茶基础知识中的特点相关知识问题1，需要结合传统工艺资料、实地调研和传承人口述进行整理，形成可供AI检索的专业知识内容。","originalStatus":"待补充","originalSource":"德昂酸茶AI知识库采集表_V1.0.xlsx · AI知识问答库 · 第17行","updatedAt":"2026-09-10","references":[{"id":"heritage","publisher":"中国非物质文化遗产网","title":"德昂族酸茶制作技艺","url":"https://www.ihchina.cn/project_details/23582/","checkedAt":"2026-09-10"}]},{"id":"017","category":"基础知识","topic":"德昂族酸茶制作技艺什么时候成为国家级非遗","question":"德昂族酸茶制作技艺什么时候成为国家级非遗？","answer":"2021年列入第五批国家级非遗代表性项目名录，类别为传统技艺。","type":"资料整理","origin":"公开资料整理","mediaNeeds":"图片/视频/音频","status":"已有","source":"中国非物质文化遗产网 · 德昂族酸茶制作技艺","published":true,"originalQuestion":"特点相关知识问题2","originalAnswer":"关于德昂酸茶基础知识中的特点相关知识问题2，需要结合传统工艺资料、实地调研和传承人口述进行整理，形成可供AI检索的专业知识内容。","originalStatus":"待补充","originalSource":"德昂酸茶AI知识库采集表_V1.0.xlsx · AI知识问答库 · 第18行","updatedAt":"2026-09-10","references":[{"id":"heritage","publisher":"中国非物质文化遗产网","title":"德昂族酸茶制作技艺","url":"https://www.ihchina.cn/project_details/23582/","checkedAt":"2026-09-10"}]},{"id":"018","category":"基础知识","topic":"酸茶制作技艺的非遗项目编号是什么","question":"酸茶制作技艺的非遗项目编号是什么？","answer":"项目序号1514，编号Ⅷ-268。","type":"资料整理","origin":"公开资料整理","mediaNeeds":"图片/视频/音频","status":"已有","source":"中国非物质文化遗产网 · 德昂族酸茶制作技艺","published":true ,"originalSource":"德昂酸茶AI知识库采集表_V1.0.xlsx · AI知识问答库 · 第63行","updatedAt":"2026-09-10","references":[]},{"id":"063","category":"冲泡与饮用","topic":"这款酸茶具体应使用多少度水、几克茶","question":"这款酸茶具体应使用多少度水、几克茶？","answer":"根据用户提供的《酸茶docx.docx》：资料记录的冲泡方式包括：蒸茶器用茶5—10克、水1000—1500毫升，时间10—20分钟；保温杯按原文茶水比1:100，闷泡15—20分钟，但茶水比的计量单位未注明；散茶盖碗用茶6—8克。盖碗部分“浸泡8—10”缺少时间单位，暂不作为操作参数。所有方式均未提供水温，也未标明对应产品规格，这些是资料中的冲泡参考，仍需补齐产品、水温与单位。","type":"用户补充资料","origin":"尚需真实采访或检测记录","mediaNeeds":"提供具体产品标签和生产者推荐冲泡方法后再补充。","status":"已有","source":"用户提供《酸茶docx.docx》第21项（未署名，未注明采集日期）","published":true,"originalQuestion":"品鉴方法相关知识问题4","originalAnswer":"关于德昂酸茶冲泡与饮用中的品鉴方法相关知识问题4，需要结合传统工艺资料、实地调研和传承人口述进行整理，形成可供AI检索的专业知识内容。","originalStatus":"待补充","originalSource":"德昂酸茶AI知识库采集表_V1.0.xlsx · AI知识问答库 · 第64行","updatedAt":"2026-09-11","references":[],"supplement":{"document":"酸茶docx.docx","section":21,"receivedAt":"2026-09-11","verification":"用户提供的经验资料，未独立核验"}},{"id":"064","category":"冲泡与饮用","topic":"这款酸茶能冲泡多少次","question":"这款酸茶能冲泡多少次？","answer":"根据用户提供的《酸茶docx.docx》：资料列出的参考冲泡次数为：蒸茶器3—4次、保温杯3—5次、散茶盖碗10—15次。文档未标明具体产品和每次续水条件，因此这些次数仅代表所提供资料的参考范围，实际表现仍需结合对应产品记录。","type":"用户补充资料","origin":"尚需真实采访或检测记录","mediaNeeds":"记录同一产品在明确投茶量、水量和时间下的多泡表现。","status":"已有","source":"用户提供《酸茶docx.docx》第22项（未署名，未注明采集日期）","published":true,"originalQuestion":"品鉴方法相关知识问题5","originalAnswer":"关于德昂酸茶冲泡与饮用中的品鉴方法相关知识问题5，需要结合传统工艺资料、实地调研和传承人口述进行整理，形成可供AI检索的专业知识内容。","originalStatus":"待补充","originalSource":"德昂酸茶AI知识库采集表_V1.0.xlsx · AI知识问答库 · 第65行","updatedAt":"2026-09-11","references":[],"supplement":{"document":"酸茶docx.docx","section":22,"receivedAt":"2026-09-11","verification":"用户提供的经验资料，未独立核验"}},{"id":"065","category":"冲泡与饮用","topic":"怎样描述酸茶口感而不夸大","question":"怎样描述酸茶口感而不夸大？","answer":"建议：分别描述酸感、涩感、香气与回甘，并注明茶样和冲泡条件。个人感受用“本次品饮感到”，不写成所有产品共同结论。","type":"采集与使用建议","origin":"知识库编辑建议","mediaNeeds":"图片/视频/音频","status":"已有","source":"知识库编辑建议（非田野事实）","published":true,"originalQuestion":"品鉴方法相关知识问题6","originalAnswer":"关于德昂酸茶冲泡与饮用中的品鉴方法相关知识问题6，需要结合传统工艺资料、实地调研和传承人口述进行整理，形成可供AI检索的专 织经验，不是已经验证的统一最长存放时限。","type":"文献案例","origin":"用户提供Word扫描资料","mediaNeeds":"补齐原文完整书目信息；需要时核对受访者、调查时间与原始记录。","status":"已整理（来源范围已标注）","source":"用户提供《德昂族酸茶的科技人类学考察.docx》 · 文内图片4、5 · 原料选取","published":true,"updatedAt":"2026-09-24","sourceDocument":"德昂族酸茶的科技人类学考察.docx","sourceImages":[4,5],"sourceSection":"原料选取","evidenceNote":"按用户提供的扫描片段整理；原文作者、完整篇名及出版信息未全部核实。个案、民俗叙述和作者解释不代表所有地区或现行操作标准。","aliases":["每天采多少茶叶","为什么按加工能力采茶"],"references":[]},{"id":"doc0924-007","category":"原料与采摘","topic":"这份调查采用的一芽两叶标准适用于所有酸茶吗","question":"这份调查采用的一芽两叶标准适用于所有酸茶吗？","answer":"图片5记录的案例采用一芽两叶，并写到芽叶长度约3—4厘米、最多不超过6厘米。这些数值属于该调查中的经验要求；其他资料和传承人的做法可能不同，不能提升为所有德昂酸茶统一的采摘标准。","type":"文献案例","origin":"用户提供Word扫描资料","mediaNeeds":"补齐原文完整书目信息；需要时核对受访者、调查时间与原始记录。","status":"已整理（来源范围已标注）","source":"用户提供《德昂族酸茶的科技人类学考察.docx》 · 文内图片5 · 采摘工序与嫩度","published":true,"updatedAt":"2026-09-24","sourceDocument":"德昂族酸茶的科技人类学考察.docx","sourceImages":[5],"sourceSection":"采摘工序与嫩度","evidenceNote":"按用户提供的扫描片段整理；原文作者、完整篇名及出版信息未全部核实。个案、民俗叙述和作者解释不代表所有地区或现行操作标准。","aliases":["调查中的采摘嫩度"],"references":[]},{"id":"doc0924-008","category":"传统制作工艺","topic":"竹编篾箕在这个制茶案例中有什么用途","question":"竹编篾箕在这个制茶案例中有什么用途？","answer":"图片5记录，篾箕用于采摘时盛放鲜叶，较大的圆形篾箕用于摊放茶叶；文中强调竹编器具的透气性及避免鲜叶捂热的作用。它是该案例常用工具之一，文档未提供器具规格或卫生检测数据。","type":"文献案例","origin":"用户提供Word扫描资料","mediaNeeds":"补齐原文完整书目信息；需要时核对受访者、调查时间与原始记录。","status":"已整理（来源范围已标注）","source":"用户提供《德昂族酸茶的科技人类学考察.docx》 · 文内图片5 · 加工工具及材料","published":true,"updatedAt":"2026-09-24","sourceDocument":"德昂族酸茶的科技人类学考察.docx","sourceImages":[5],"sourceSection":"加工工具及材料","evidenceNote":"按用户提供的扫描片段整理；原文作者、完整篇名及出版信息未全部核实。个案、民俗叙述和作者解释不代表所有地区或现行操作标准。","aliases":["篾箕有什么用","酸茶使用哪些竹编工具"],"references":[]},{"id":"doc0924-009","category":"传统制作工艺","topic":"文档中的fangrao是什么密封材料","question":"文档中的fangrao是什么密封材料？","answer":"图片5将fangrao记为当地德昂语称呼，描述其为叶片较宽的野生植物，正文及脚注称其属竹芋属，并记录其被用于酸茶密封。截图未给出完整物种学名、鉴定报告和安全检测，不能据此自行识别采用野生叶片或确认防腐功效。","type":"文献案例","origin":"用户提供Word扫描资料","mediaNeeds":"补齐原文完整书目信息；需要时核对受访者、调查时间与原始记录。","status":"已整理（来源范围已标注）","source":"用户提供《德昂族酸茶的科技人类学考察.docx》 · 文内图片5 · 密封材料与脚注","published":true,"updatedAt":"2026-09-24","sourceDocument":"德昂族酸茶的科技人类学考察.docx","sourceImages":[5],"sourceSection":"密封材料与脚注","evidenceNote":"按用户提供的扫描片段整理；原文作者、完整篇名及出版信息未全部核实。个案、民俗叙述和作者解释不代表所有地区或现行操作标准。","aliases":["fangrao是什么","酸茶封口用的野生叶片"],"references":[]},{"id":"doc0924-010","category":"传统制作工艺","topic":"调查记录了怎样的竹筒选择经验","question":"调查记录了怎样的竹筒选择经验？","answer":"图片5记录使用当地称为大龙竹的竹材，并以自然晾干后的手感判断是否合用。文中的季节选择及“干燥程度”属于受访经验描述，没有给出可重复的含水率测量方法，因此不把这些经验数字作为生产控制参数。","type":"文献案例","origin":"用户提供Word扫描资料","mediaNeeds":"补齐原文完整书目信息；需要时核对受访者、调查时间与原始记录。","status":"已整理（来源范围已标注）","source":"用户提供《德昂族酸茶的科技人类学考察.docx》 · 文内图片5 · 竹筒材料选择","published":true,"updatedAt":"2026-09-24","sourceDocument":"德昂族酸茶的科技人类学考察.docx","sourceImages":[5],"sourceSection":"竹筒材料选择","evidenceNote":"按用户提供的扫描片段整理；原文作者、完整篇名及出版信息未全部核实。个案、民俗叙述和作者解释不代表所有地区或现行操作标准。","aliases":["酸茶竹筒怎么选"],"references":[]},{"id":"doc0924-011","category":"传统制作工艺","topic":"调查怎样描述揉茶工具的变化","question":"调查怎样描述揉茶工具的变化？","answer":"图片5提到过去使用木制揉茶机，而调查所述的少量制作以手工揉茶为主；揉茶力度和时长依靠经验与手感。文中还提及一台收藏展示的旧工具，但截图未提供可核实的馆藏编号或当前展陈信息。","type":"文献案例","origin":"用户提供Word扫描资料","mediaNeeds":"补齐原文完整书目信息；需要时核对受访者、调查时间与原始记录。","status":"已整理（来源范围已标注）","source":"用户提供《德昂族酸茶的科技人类学考察.docx》 · 文内图片5 · 揉茶工具与揉茶工序","published":true,"updatedAt":"2026-09-24","sourceDocument":"德昂族酸茶的科技人类学考察.docx","sourceImages":[5],"sourceSection":"揉茶工具与揉茶工序","evidenceNote":"按用户提供的扫描片段整理；原文作者、完整篇名及出版信息未全部核实。个案、民俗叙述和作者解释不代表所有地区或现行操作标准。","aliases":["以前用揉茶机吗"],"references":[]},{"id":"doc0924-012","category":"传统制作工艺","topic":"这份调查中的鲜叶摊晾和成品晒干有什么区别","question":"这份调查中的鲜叶摊晾和成品晒干有什么区别？","answer":"图片5描述采回鲜叶应摊开、避免太阳直晒；图片6描述发酵后出筒的茶叶摊在篾箕上，选择晴天晒干并翻动。二者处于不同阶段，不能把鲜叶摊晾、蒸后摊凉和成品干燥混成同一个步骤。","type":"文献案例","origin":"用户提供Word扫描资料","mediaNeeds":"补齐原文完整书目信息；需要时核对受访者、调查时间与原始记录。","status":"已整理（来源范围已标注）","source":"用户提供《德昂族酸茶的科技人类学考察.docx》 · 文内图片5、6 · 鲜叶处理与成品干燥","published":true,"updatedAt":"2026-09-24","sourceDocument":"德昂族酸茶的科技人类学考察.docx","sourceImages":[5,6],"sourceSection":"鲜叶处理与成品干燥","evidenceNote":"按用户提供的扫描片段整理；原文作者、完整篇名及出版信息未全部核实。个案、民俗叙述和作者解释不代表所有地区或现行操作标准。","aliases":["摊晾和晒干有什么区别"],"references":[]},{"id":"doc0924-013","category":"传统制作工艺","topic":"调查案例的装筒与埋藏过程如何描述","question":"调查案例的装筒与埋藏过程如何描述？","answer":"图片5记录揉茶后装入竹筒并压紧，土坑衬垫植物叶片，竹筒口朝下放置、压石后覆土，并强调避免进水和漏气。这是特定传统案例的描述；截图没有提供微生物检测或批次合格依据，不构成可直接照做的完整生产规程。","type":"文献案例","origin":"用户提供Word扫描资料","mediaNeeds":"补齐原文完整书目信息；需要时核对受访者、调查时间与原始记录。","status":"已整理（来源范围已标注）","source":"用户提供《德昂族酸茶的科技人类学考察.docx》 · 文内图片5 · 装竹筒发酵","published":true,"updatedAt":"2026-09-24","sourceDocument":"德昂族酸茶的科技人类学考察.docx","sourceImages":[5],"sourceSection":"装竹筒发酵","evidenceNote":"按用户提供的扫描片段整理；原文作者、完整篇名及出版信息未全部核实。个案、民俗叙述和作者解释不代表所有地区或现行操作标准。","aliases":["案例中竹筒为什么朝下"],"references":[]},{"id":"doc0924-014","category":"发酵知识","topic":"资料中的60—70天发酵记录该怎样理解","question":"资料中的60—70天发酵记录该怎样理解？","answer":"图片5—6中的受访工艺案例记录了约60—70天的埋藏发酵过程。这是特定案例的经验时长，截图没有完整列出原料、温度、容器和检测条件，不能作为所有酸茶的最佳发酵时长，也不能仅凭天数判断成熟或安全。","type":"文献案例","origin":"用户提供Word扫描资料","mediaNeeds":"补齐原文完整书目信息；需要时核对受访者、调查时间与原始记录。","status":"已整理（来源范围已标注）","source":"用户提供《德昂族酸茶的科技人类学考察.docx》 · 文内图片5、6 · 发酵时长的个案记录","published":true,"updatedAt":"2026-09-24","sourceDocument":"德昂族酸茶的科技人类学考察.docx","sourceImages":[5,6],"sourceSection":"发酵时长的个案记录","evidenceNote":"按用户提供的扫描片段整理；原文作者、完整篇名及出版信息未全部核实。个案、民俗叙述和作者解释不代表所有地区或现行操作标准。","aliases":["60到70天发酵","六七十天发酵"],"references":[]},{"id":"doc0924-015","category":"发酵知识","topic":"文档如何记录中途打开竹筒的经验","question":"文档如何记录中途打开竹筒的经验？","answer":"图片6记述杨师傅曾在十余天、二十天和一个月左右分别打开部分竹筒观察，文中将随后出现的品质欠缺与漏气联系起来。这是经验观察，截图没有给出对照试验和检测数据，不能据此确定全部品质问题的唯一原因。","type":"文献案例","origin":"用户提供Word扫描资料","mediaNeeds":"补齐原文完整书目信息；需要时核对受访者、调查时间与原始记录。","status":"已整理（来源范围已标注）","source":"用户提供《德昂族酸茶的科技人类学考察.docx》 · 文内图片6 · 中途开筒的经验观察","published":true,"updatedAt":"2026-09-24","sourceDocument":"德昂族酸茶的科技人类学考察.docx","sourceImages":[6],"sourceSection":"中途开筒的经验观察","evidenceNote":"按用户提供的扫描片段整理；原文作者、完整篇名及出版信息未全部核实。个案、民俗叙述和作者解释不代表所有地区或现行操作标准。","aliases":["发酵中途打开竹筒"],"references":[]},{"id":"doc0924-016","category":"传统制作工艺","topic":"该案例的酸茶出筒后怎样处理","question":"该案例的酸茶出筒后怎样处理？","answer":"图片6描述取出竹筒后掏出茶叶、在篾箕上摊匀并翻动晒干；另提到部分文献中的舂制与压饼有关。该案例不意味着所有产品必须压饼，也不能把“压制与干燥”的小标题理解为每批茶都完成相同压制工序。","type":"文献案例","origin":"用户提供Word扫描资料","mediaNeeds":"补齐原文完整书目信息；需要时核对受访者、调查时间与原始记录。","status":"已整理（来源范围已标注）","source":"用户提供《德昂族酸茶的科技人类学考察.docx》 · 文内图片6 · 压制与干燥","published":true,"updatedAt":"2026-09-24","sourceDocument":"德昂族酸茶的科技人类学考察.docx","sourceImages":[6],"sourceSection":"压制与干燥","evidenceNote":"按用户提供的扫描片段整理；原文作者、完整篇名及出版信息未全部核实。个案、民俗叙述和作者解释不代表所有地区或现行操作标准。","aliases":["调查中出筒后怎么做"],"references":[]},{"id":"doc0924-017","category":"冲泡与饮用","topic":"调查中记录了哪些传统储茶方式","question":"调查中记录了哪些传统储茶方式？","answer":"图片6—7记录了袋装便于日常取用、瓦罐或桶等容器密封储存，以及火塘上方悬放等传统方式。火塘上方的做法属于生活场景记录，不作为现代家庭储存建议；具体产品应按其标签要求保存，文中“长期保存”的说法不能替代保质期依据。","type":"文献案例","origin":"用户提供Word扫描资料","mediaNeeds":"补齐原文完整书目信息；需要时核对受访者、调查时间与原始记录。","status":"已整理（来源范围已标注）","source":"用户提供《德昂族酸茶的科技人类学考察.docx》 · 文内图片6、7 · 储藏方式","published":true,"updatedAt":"2026-09-24","sourceDocument":"德昂族酸茶的科技人类学考察.docx","sourceImages":[6,7],"sourceSection":"储藏方式","evidenceNote":"按用户提供的扫描片段整理；原文作者、完整篇名及出版信息未全部核实。个案、民俗叙述和作者解释不代表所有地区或现行操作标准。","aliases":["传统储茶方式有哪些"],"references":[]},{"id":"doc0924-018","category":"冲泡与饮用","topic":"调查怎样区分煮茶、烤茶和泡茶","question":"调查怎样区分煮茶、烤茶和泡茶？","answer":"图片8把饮茶方式分为煮茶、烤茶和泡茶：煮茶将茶与水一起加热；烤茶先在小茶罐中烘烤再注水煮沸；泡茶用热水浸泡。文中还将烤茶与待客场景联系起来。这是所录生活习惯，未提供适用于具体商品的完整投茶量和水温方案。","type":"文献案例","origin":"用户提供Word扫描资料","mediaNeeds":"补齐原文完整书目信息；需要时核对受访者、调查时间与原始记录。","status":"已整理（来源范围已标注）","source":"用户提供《德昂族酸茶的科技人类学考察.docx》 · 文内图片8 · 日常品饮与食茶","published":true,"updatedAt":"2026-09-24","sourceDocument":"德昂族酸茶的科技人类学考察.docx","sourceImages":[8],"sourceSection":"日常品饮与食茶","evidenceNote":"按用户提供的扫描片段整理；原文作者、完整篇名及出版信息未全部核实。个案、民俗叙述和作者解释不代表所有地区或现行操作标准。","aliases":["煮茶烤茶泡茶的区别"],"references":[]},{"id":"doc0924-019","category":"冲泡与饮用","topic":"资料中的食茶与腌茶指什么","question":"资料中的食茶与腌茶指什么？","answer":"图片9描述茶叶作为食材拌食，以及将鲜叶加入其他配料装入陶罐密封的腌茶做法，展示饮茶之外的饮食习惯。这里只收录其食用形态，不提供可直接执行的腌制配方；截图未包含足以验证食品安全的处理、储存和检测条件。","type":"文献 idenceNote":"按所附规划截图整理，数字为2025—2027年计划目标，不代表实施进度或完成实绩；未独立核验官方全文及后续变更。","aliases":["酸茶三年行动计划","2027年酸茶产量目标"],"references":[]},{"id":"doc0924-026","category":"产业发展规划","topic":"行动计划中的一心两区域指什么","question":"行动计划中的一心两区域指什么？","answer":"所附计划以芒市三台山德昂族乡为核心，联动其他聚居区发展技艺传承、文化研究与体验中心；以“六大茶山”“九大古茶园”等构建生态优质原料优势区；串联茶园、茶马古道等资源建设产业融合区。这是规划布局，不代表所有设施已建成。","type":"规划目标","origin":"用户提供Word扫描资料","mediaNeeds":"补齐原文完整书目信息；需要时核对受访者、调查时间与原始记录。","status":"已整理（来源范围已标注）","source":"用户提供《德昂族酸茶的科技人类学考察.docx》 · 文内图片11 · 重点工作第1项","published":true,"updatedAt":"2026-09-24","sourceDocument":"德昂族酸茶的科技人类学考察.docx","sourceImages":[11],"sourceSection":"重点工作第1项","evidenceNote":"按所附规划截图整理，数字为2025—2027年计划目标，不代表实施进度或完成实绩；未独立核验官方全文及后续变更。","aliases":["一心两区域"],"references":[]},{"id":"doc0924-027","category":"产业发展规划","topic":"行动计划拟通过哪些方式支持酸茶产业投入","question":"行动计划拟通过哪些方式支持酸茶产业投入？","answer":"所附计划提出整合州县财政资金，支持标准、加工场所、品牌、市场、科研和人才培养，并提出争取相关项目支持及开发茶企、茶园金融产品。截图没有具体申请细则、金额或受理时间，不能据此承诺补贴或贷款可得性。","type":"规划目标","origin":"用户提供Word扫描资料","mediaNeeds":"补齐原文完整书目信息；需要时核对受访者、调查时间与原始记录。","status":"已整理（来源范围已标注）","source":"用户提供《德昂族酸茶的科技人类学考察.docx》 · 文内图片12 · 重点工作第2项","published":true,"updatedAt":"2026-09-24","sourceDocument":"德昂族酸茶的科技人类学考察.docx","sourceImages":[12],"sourceSection":"重点工作第2项","evidenceNote":"按所附规划截图整理，数字为2025—2027年计划目标，不代表实施进度或完成实绩；未独立核验官方全文及后续变更。","aliases":["酸茶产业支持方向"],"references":[]},{"id":"doc0924-028","category":"产业发展规划","topic":"计划如何安排古茶树资源保护和数字化管理","question":"计划如何安排古茶树资源保护和数字化管理？","answer":"所附计划提出开展古茶树资源普查、划定保护范围、挂牌保护，建立数字化管理平台，并保护繁育优质茶树种质资源；到2027年的目标包括建设1个茶树种质资源圃。这是计划安排，截图不能证明平台或资源圃已经建成。","type":"规划目标","origin":"用户提供Word扫描资料","mediaNeeds":"补齐原文完整书目信息；需要时核对受访者、调查时间与原始记录。","status":"已整理（来源范围已标注）","source":"用户提供《德昂族酸茶的科技人类学考察.docx》 · 文内图片12 · 重点工作第3项","published":true,"updatedAt":"2026-09-24","sourceDocument":"德昂族酸茶的科技人类学考察.docx","sourceImages":[12],"sourceSection":"重点工作第3项","evidenceNote":"按所附规划截图整理，数字为2025—2027年计划目标，不代表实施进度或完成实绩；未独立核验官方全文及后续变更。","aliases":["古茶树数字化管理","种质资源圃规划"],"references":[]},{"id":"doc0924-029","category":"产业发展规划","topic":"计划怎样提升酸茶原料基地","question":"计划怎样提升酸茶原料基地？","answer":"所附计划以“六大茶山”“九大古茶园”为重点，提出仿古茶园建设、现代生态茶园改造和扩大绿色有机茶园规模，到2027年新增面积目标为2万亩。该目标不意味着所有相关产品已经获得有机认证。","type":"规划目标","origin":"用户提供Word扫描资料","mediaNeeds":"补齐原文完整书目信息；需要时核对受访者、调查时间与原始记录。","status":"已整理（来源范围已标注）","source":"用户提供《德昂族酸茶的科技人类学考察.docx》 · 文内图片12 · 重点工作第4项","published":true,"updatedAt":"2026-09-24","sourceDocument":"德昂族酸茶的科技人类学考察.docx","sourceImages":[12],"sourceSection":"重点工作第4项","evidenceNote":"按所附规划截图整理，数字为2025—2027年计划目标，不代表实施进度或完成实绩；未独立核验官方全文及后续变更。","aliases":["原料基地建设目标"],"references":[]},{"id":"doc0924-030","category":"产业发展规划","topic":"计划提出怎样的酸茶标准和质量追溯建设","question":"计划提出怎样的酸茶标准和质量追溯建设？","answer":"所附计划提出覆盖种植、加工、贮存、冲泡等环节的标准体系和“从茶园到茶杯”的质量追溯，支持加工场所改造及抽样检测。到2027年的目标包括地方标准3项以上、新增SC生产企业10家以上、小作坊15家以上。这是建设目标，未提供已发布标准清单和实际验收结果。","type":"规划目标","origin":"用户提供Word扫描资料","mediaNeeds":"补齐原文完整书目信息；需要时核对受访者、调查时间与原始记录。","status":"已整理（来源范围已标注）","source":"用户提供《德昂族酸茶的科技人类学考察.docx》 · 文内图片12 · 重点工作第5项","published":true,"updatedAt":"2026-09-24","sourceDocument":"德昂族酸茶的科技人类学考察.docx","sourceImages":[12],"sourceSection":"重点工作第5项","evidenceNote":"按所附规划截图整理，数字为2025—2027年计划目标，不代表实施进度或完成实绩；未独立核验官方全文及后续变更。","aliases":["从茶园到茶杯追溯","酸茶标准建设目标"],"references":[]},{"id":"doc0924-031","category":"产业发展规划","topic":"计划如何安排加工升级与衍生产品开发","question":"计划如何安排加工升级与衍生产品开发？","answer":"所附计划提出改造加工装备、提升机械化自动化智能化水平，并探索茶食品、饮料、工艺品等衍生产品。规划中列举的开发方向不等于已有上市产品，也不证明其中涉及健康用途的产品已获批准或验证功效。","type":"规划目标","origin":"用户提供Word扫描资料","mediaNeeds":"补齐原文完整书目信息；需要时核对受访者、调查时间与原始记录。","status":"已整理（来源范围已标注）","source":"用户提供《德昂族酸茶的科技人类学考察.docx》 · 文内图片13 · 重点工作第6项","published":true,"updatedAt":"2026-09-24","sourceDocument":"德昂族酸茶的科技人类学考察.docx","sourceImages":[13],"sourceSection":"重点工作第6项","evidenceNote":"按所附规划截图整理，数字为2025—2027年计划目标，不代表实施进度或完成实绩；未独立核验官方全文及后续变更。","aliases":["酸茶加工升级方向"],"references":[]},{"id":"doc0924-032","category":"产业发展规划","topic":"计划中的酸茶品牌体系是什么","question":"计划中的酸茶品牌体系是什么？","answer":"所附计划提出“区域性公用品牌＋企业品牌＋产品品牌”的品牌体系，推动地理标志及相关保护申报；到2027年拟培育3个以上省内领军企  };
 function search(q,records){
  if(typeof q!=='string'||!q.trim())return [];
  const normalized=canonical(q);
  const exact=records.find(r=>[r.question,...(aliases[r.id]||[]),...(r.aliases||[])].some(t=>canonical(t)===normalized));
  if(exact)return exact.published?[exact]:[];
  if(/治[疗好]|降血糖|糖尿病|怀孕|孕妇|用药|减肥|最佳温度|最适温度|杀菌温度|湿度|ph|总酸|几分钟|多少分钟|树龄|手机号/i.test(q))return [];
  const query=grams(q);if(!query.size)return [];
  const all=records.map(r=>({record:r,title:grams([r.question,r.topic,...(aliases[r.id]||[]),...(r.aliases||[])].join(' ')),body:grams(r.answer)}));
  const df={};for(const x of all)for(const term of x.title)df[term]=(df[term]||0)+1;
  const hits=all.map(x=>{let score=0,matched=0;for(const term of query){const weight=1+Math.log(1+all.length/(1+(df[term]||0)));if(x.title.has(term)){score+=weight*3;matched++}else if(x.body.has(term)){score+=weight*.35;matched+=.1}}
   return {...x,score,coverage:matched/query.size};
  }).filter(x=>x.score>=7&&x.coverage>=.35).sort((a,b)=>b.score-a.score);
  if(!hits.length||!hits[0].record.published)return [];
  return [hits[0].record];
 }

<script>(function(root){

    if(!raw||!['tea_product','loose_tea','unrelated','unclear','similar','no_match'].includes(raw.kind))throw Error('识别服务返回了无法读取的结果');
    const ids=new Set(products.map(p=>p.id));

    const seen=new Set();
    const candidates=['tea_product','similar'].includes(raw.kind)?(Array.isArray(raw.candidates)?raw.candidates:[]).filter(c=>{
      if(!c||!ids.has(c.product_id)||seen.has(c.product_id))return false;
      seen.add(c.product_id);return true;
    }).slice(0,LIMIT).map(c=>({product_id:c.product_id,evidence:text(c.evidence,300),strength:c.strength==='label_and_visual'?'label_and_visual':'visual_only'})):[];
    return {kind:raw.kind,description:text(raw.description),visible_text:text(raw.visible_text),candidates,
      limitations:text(raw.limitations)||'照片只能提供外观线索，不能确认品质、真伪、原料或生产批次。'};
  }
  function card(data,id,mode='manual',result=null){

      videoIds:['2','3','4','5']};

      `生成方式：${c.mode==='local'?'本机图像相似检索，经用户确认':c.mode==='ai'?'多模态候选匹配，经用户确认':c.mode==='manual'?'用户手动选择图鉴（非AI识别）':'酸茶通识（非图片鉴定）'}`,
      '',c.notice,...c.sections.flatMap(s=>['',s.title,...s.records.flatMap(r=>[r.question,r.answer,`来源：${r.source}`])]),
      '', '相关影像请回到网页查看；空缺的素材不会自动生成。'].join('\n');
  }
  const api={normalizeResult,card,exportText};
  if(typeof module!=='undefined')module.exports=api;else root.TeaVisionCore=api;
})(typeof globalThis!=='undefined'?globalThis:this);

function render(){if(!['home','knowledge','chat','identify','products','videos','studio','mine','creative'].includes(page))page='home';$('#main').innerHTML=({home,knowledge,chat,identify,products,videos:videoPage,studio,mine,creative}[page])();const n=nav.map(([p,icon,label])=>`<button data-page="${p}" class="${p===page?'active':''}"><b>${icon}</b>${label}</button>`).join('');$('#side-nav').innerHTML=n;$('#bottom-nav').innerHTML=n;if(page==='studio')fillVideo();}
function fillVideo(){const v=videos.find(v=>v.id===$('#video-slot').value);$('#video-title').value=v.title;$('#video-url').value=v.url;$('#video-poster').value=v.poster||''}
function download(name,text,type='text/plain'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function makeScript(){const id=$('#script-topic').value,duration=$('#script-duration').value;let t=`德昂茶语 · 拍摄脚本草稿\n建议时长：${duration}\n画幅建议：竖屏 9:16；另留横屏全景素材。\n\n`;
if(id==='interview'){t+='开场：茶园或制茶空间全景，保留环境声。\n\n'+TEA_DATA.interviews.map((x,i)=>`${i+1}. ${x.topic}\n采访问题：${x.question}\n记录目标：${x.goal}\n镜头：人物中景，穿插手部与工具特写。`).join('\n\n')+'\n\n结尾：请受访者留下一句想对年轻人说的话。\n来源：采集表 · 传承人采访提纲。';}else{const r=record(id);t+=`主题：${r.question}\n\n镜头 1（开场，约 15%）：茶园远景与叶片特写，保留风声。\n镜头 2（主体，约 65%）：${id==='006'?'依次记录采摘、晾晒、蒸茶、揉捻、装竹筒、密封、埋土发酵、出筒、晒干。采用不同时间素材剪辑，不暗示即时完成。':id==='004'?'拍摄茶树、鲜叶与采摘细节。':'拍摄冲泡、茶汤与品饮动作。'}\n旁白：${r.answer}\n镜头 3（结尾，约 20%）：成品与人物手部特写，收束到“让茶的记忆继续生长”。\n\n来源：${r.source}\n不添加原资料未给出的发酵天数、温度或功效。`;}
$('#script-result').textContent=t;save('tea-script',t)}

if(b.dataset.favorite){const id=b.dataset.favorite;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save('tea-favorites',favorites);b.textContent=favorites.includes(id)?'取消收藏':'收藏知识';toast(favorites.includes(id)?'已收藏到我的茶林':'已取消收藏');if(!$('#detail').open)render()}
if(b.dataset.product){const p=TEA_DATA.products.find(x=>x.id===b.dataset.product);open(`<span class="eyebrow">${p.category}</span><h2>${p.name}</h2><img loading="lazy" decoding="async" src="${p.image}" alt="${p.name}原始产品册页面"><p class="meta">来源：${p.source}。原册价格及规格供查阅，当前信息请向商家确认。</p><button class="primary" data-vselect="${p.id}">查看这款的知识卡 ↗</button>`)}
if(b.dataset.question)ask(b.dataset.question);
if(b.classList.contains('close'))$('#detail').close();
if(b.id==='clear-chat'){messages=[];save('tea-messages',messages);render();toast('问答记录已清空')}
if(b.id==='export-videos')download('videos.json',JSON.stringify(videos,null,2),'application/json');
if(b.id==='make-script')makeScript();
if(b.id==='export-script'){const t=$('#script-result').textContent;if(t.startsWith('选择主题'))return toast('请先生成拍摄脚本');download('德昂茶语-拍摄脚本.txt',t)}
});
document.addEventListener('input',e=>{if(e.target.id==='knowledge-search'){query=e.target.value;$('#knowledge-results').innerHTML=knowledgeResults()}});
document.addEventListener('change',e=>{if(e.target.id==='video-slot')fillVideo();if(e.target.id==='local-video'){const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('video/'))return toast('请选择视频文件');if(window.previewUrl)URL.revokeObjectURL(window.previewUrl);window.previewUrl=URL.createObjectURL(f);$('#local-preview').innerHTML=`<video controls style="width:100%" src="${window.previewUrl}"></video>`}});
document.addEventListener('submit',e=>{if(e.target.id==='chat-form'){e.preventDefault();ask($('#chat-input').value.trim())}if(e.target.id==='video-form'){e.preventDefault();const url=$('#video-url').value.trim(),poster=$('#video-poster').value.trim();if([url,poster].some(u=>u&&!u.startsWith('https://')))return toast('正式视频与封面请填写 HTTPS 地址');videos=videos.map(v=>v.id===$('#video-slot').value?{...v,title:$('#video-title').value.trim(),url,poster}:v);if(save('tea-videos',videos))toast('视频配置已保存，可到茶林影像查看')}});
const creativeEpisodes=[{"id":"v1","name":"第一集.mp4","duration":85.31},{"id":"v2","name":"第二集.mp4","duration":106.14},{"id":"v3","name":"第三集.mp4","duration":108.21000000000001},{"id":"v4","name":"第四集..mp4","duration":95.57},{"id":"v5","name":"第五集.mp4","duration":94.41}];
const creativeState={episodeId:'v1',theme:'intro',audience:'初次接触酸茶的公众',format:'60秒短视频',plan:null,content:null,selected:'',busy:false,error:''};
function creativeRefs(sources){return `<details><summary>查看本次系统资料与出处（${sources.length}条）</summary>${sources.map(s=>`<section class="panel"><strong>${esc(s.id)} · ${esc(s.title||'调查结论')}</strong><p>${esc(s.text)}</p><small>来源：${esc(s.source)}</small>${s.evidenceNote?`<p>${esc(s.evidenceNote)}</p>`:''}</section>`).join('')}</details>`}
function creative(){const s=creativeState,p=s.plan,c=s.content;const select=(id,label,items,value)=>`<label class="field">${label}<select id="${id}" class="search" ${s.busy?'disabled':''}>${items.map(x=>{const [v,t]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}" ${v===value?'selected':''}>${esc(t)}</option>`}).join('')}</select></label>`;return header('AI传播创作')+`<div class="chat-layout"><section class="page-intro"><span class="eyebrow">FROM KNOWLEDGE TO STORIES</span><h1>让酸茶故事有据可循</h1><p>保留主题与人群选择，按Word故事脚本改编约1分钟短视频。五集分别保存，保留每集完整剧情、原声和原时长。文字分镜仅作改编建议，不再自动剪切拼接。</p></section><section class="panel"><h2>第一阶段 · 传播策划</h2>${select('creative-theme','宣传主题',[['intro','认识德昂酸茶'],['craft','传统制作工艺'],['culture','茶与民族文化'],['storage','酸茶分类与存放']],s.theme)}${select('creative-audience','目标人群',['初次接触酸茶的公众','青年学生','茶文化爱好者','文化旅游访客'],s.audience)}${select('creative-format','内容形式',['60秒短视频'],s.format)}<button class="primary" id="creative-plan" ${s.busy?'disabled':''}>生成传播选题</button><p class="subtle">点击生成会将选择和相关系统资料交给AI处理，消耗接口额度。</p></section>${s.busy?'<p role="status" class="loading">正在依据资料生成，请稍候…</p>':''}${s.error?`<p role="alert" class="message">${esc(s.error)}</p>`:''}${p?`<section class="panel"><h2>推荐选题</h2>${p.message?`<p>${esc(p.message)}</p>`:''}${(p.gaps||[]).map(g=>`<p class="subtle">${esc(g)}</p>`).join('')}${p.options.map(o=>`<article class="message"><h3>${esc(o.title)}</h3><p><strong>传播角度：</strong>${esc(o.angle)}</p><p><strong>推荐依据：</strong>${esc(o.basis)}</p><small>资料引用：${esc(o.sourceIds.join('、'))}</small>${o.evidence.map(e=>`<blockquote>${esc(e.quote)} <small>${esc(e.id)}</small></blockquote>`).join('')}<button class="${s.selected===o.id?'primary':'secondary'}" data-creative-select="${o.id}" ${s.busy?'disabled':''}>${s.selected===o.id?'已选定此选题':'选定此选题'}</button></article>`).join('')}${creativeRefs(p.sources)}</section>`:''}${p?.options.length?`<section class="panel"><h2>第二阶段 · 内容创作</h2><p>${s.selected?'已选定：'+esc(p.options.find(o=>o.id===s.selected).title):'请先在上方选定一个传播选题。'}</p><button class="primary" id="creative-content" ${!s.selected||s.busy?'disabled':''}>确认选题并生成内容</button></section>`:''}${c?`<section class="panel"><h2>${esc(c.title)}</h2><p class="subtle">${esc(c.notice)}</p><h3>完整旁白 / 角色对白</h3><div class="message">${esc(c.script)}</div><h3>文字分镜</h3>${c.storyboard.map(x=>`<article class="message"><strong>第${esc(x.shot)}镜 · ${esc(x.timeRange)}</strong><p>剪辑画面：${esc(x.visual)}</p><p>文案：${esc(x.voice)}</p><p>配音 / 音效：${esc(x.sound)}</p><details><summary>AI画面提示词（中英文）</summary><p>${esc(x.imagePromptZh)}</p><p>${esc(x.imagePromptEn)}</p></details><small>资料：${esc(x.sourceIds.join('、')||'创意安排，无事实引用')}</small></article>`).join('')}<h3>所需素材</h3>${c.materials.map(x=>`<p>□ ${esc(x.name)} · ${esc(x.status)}</p>`).join('')}<h3>资料与素材缺口</h3>${c.gaps.map(x=>`<p>${esc(x)}</p>`).join('')}${creativeRefs(c.sources)}${creativeFinalVideo(c)}<button class="secondary" id="creative-export">下载创作稿</button></section>`:''}</div>`+footer()}
async function runCreative(stage){const s=creativeState;if(s.busy)return;if(stage==='content'&&(!s.plan||!s.selected))return;s.busy=true;s.error='';s.content=null;const body=stage==='plan'?{stage,episodeId:s.episodeId,theme:s.theme,audience:s.audience,format:s.format}:{stage,planId:s.plan.planId,optionId:s.selected,confirmed:true};if(stage==='plan'){s.plan=null;s.selected=''}render();try{const access=visionState.accessCode;const r=await fetch('/api/creative',{method:'POST',headers:{'Content-Type':'application/json',...(access?{Authorization:'Bearer '+access}:{})},body:JSON.stringify(body),signal:teaTimeoutSignal(70000)});const data=await r.json();if(!r.ok)throw Error(data.error||'生成失败');if(stage==='plan')s.plan=data;else {s.content=data;}}catch(e){s.error=e.name==='TimeoutError'?'生成超时，请重试；未展示未完成内容。':e.message}finally{s.busy=false;if(page==='creative')render()}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='creative-plan')runCreative('plan');if(b.id==='creative-content')runCreative('content');if(b.dataset.creativeSelect&&!creativeState.busy){creativeState.selected=b.dataset.creativeSelect;creativeState.content=null;render()}if(b.id==='creative-export'&&creativeState.content){const c=creativeState.content;download((c.episode?.name.replace(/\.mp4$/i,'')||'德昂酸茶')+'-文字创作稿.txt',[c.title,c.notice,'已确认选题：'+c.confirmedTopic,'目标人群：'+c.audience,'内容形式：'+c.format,'完整脚本',c.script,'分镜',...c.storyboard.map(x=>`${x.shot}. ${x.timeRange} ${x.visual}\n${x.voice}\n中文提示词：${x.imagePromptZh}\nEnglish: ${x.imagePromptEn}\n配音音效：${x.sound}\n引用：${x.sourceIds.join('、')}`),'所需素材',...c.materials.map(x=>x.name+'：'+x.status),'缺少资料',...c.gaps,'资料出处',...c.sources.map(x=>`${x.id} ${x.source}\n${x.text}`)].join('\n\n'))}});
document.addEventListener('change',e=>{const field={'creative-episode':'episodeId','creative-theme':'theme','creative-audience':'audience','creative-format':'format'}[e.target.id];if(field&&!creativeState.busy){creativeState[field]=e.target.value;creativeState.plan=null;creativeState.content=null;creativeState.selected='';creativeState.error='';render()}});

function creativeFinalVideo(c){const v=c.episode;if(!v)return '';return `<section class="panel"><h3>${esc(v.name)} · 完整原片</h3><p>原片约${Math.round(v.duration)}秒，未剪切；文字脚本与原片单独保存。</p><video controls preload="none" style="width:100%;max-height:480px" src="${esc(v.url)}"></video><p><a class="primary" href="${esc(v.url)}" download="${esc(v.name)}">下载本集完整视频</a></p></section>`}
function creativeEpisodeLibrary(){return `<section class="panel"><h2>系列视频 · 按集保存</h2><p>直接播放或下载完整原片，无需先生成脚本。</p>${creativeEpisodes.map(v=>`<details><summary>${esc(v.name)} · 约${Math.round(v.duration)}秒</summary><video controls preload="none" style="width:100%;max-height:400px" src="/api/creative/media/${v.id}"></video><p><a class="secondary" href="/api/creative/media/${v.id}" download="${esc(v.name)}">下载本集</a></p></details>`).join('')}</section>`}

const visionState={image:'',filename:'',busy:false,loading:false,connecting:false,consent:false,result:null,card:null,error:'',service:'checking',requiresAccessCode:false,accessCode:'',controller:null,epoch:0};
const visionEndpoint=()=>'';
function visionStatusLabel(){return {checking:'正在检查识茶服务…',ready:'豆包配置已填写 · 待实际识图验证',offline:'当前可浏览图鉴知识卡，AI识茶暂未连接',unconfigured:'AI识茶尚未开通，可先浏览图鉴知识卡'}[visionState.service];}
async function checkVisionService(){
  const base=visionEndpoint();
  if(!window.TEA_PUBLIC_API_BASE){visionState.service='offline';if(page==='identify')render();return;}
  try{const r=await fetch(base+'/api/vision/status',{signal:teaTimeoutSignal(12000)});if(!r.ok)throw Error();const d=await r.json();visionState.service=d.configured?'ready':'unconfigured';visionState.requiresAccessCode=!!d.requiresAccessCode;if(!d.configured)visionState.error=d.setupMessage||'请先填写豆包配置文件并重启服务';}
  catch{visionState.service='offline';}

}
function visionRecordBlock(r){return `<details class="vision-record"><summary>${esc(r.question)}</summary><p>${esc(r.answer)}</p><small>来源：${esc(r.source)}</small><button class="text-btn" data-record="${esc(r.id)}">查看完整出处 ↗</button></details>`;}

    ${c.sections.map((s,i)=>`<section class="vision-card-section"><h3><i>0${i+2}</i> ${esc(s.title)}</h3><p class="subtle">${s.key==='brewing'?'尚缺本产品专属冲泡档案。以下为通用参考，投茶量、水温和时间以包装说明为准。':s.key==='process'?'传统工艺通识，不代表这款商品的实际生产流程。':s.key==='culture'?'相关文化背景，不等于该产品的品牌历史。':'知识库中的酸茶通识。'}</p>${s.records.map(visionRecordBlock).join('')}</section>`).join('')}
    
    <div class="vision-footnote">${esc(c.notice)}</div><div class="actions"><button class="primary" id="vision-export">下载知识卡</button><button class="secondary" data-page="chat">继续问茶 ↗</button><button class="text-btn" id="vision-again">再识一张</button></div></div></section>`;

function visionResults(){
  const r=visionState.result;if(!r)return '';
  const titles={tea_product:'看看这些图鉴候选',loose_tea:'看到了茶叶外观，仍无法确认品种',unrelated:'未发现可匹配的酸茶产品',unclear:'照片信息还不够清楚'};
  return `<section class="vision-results" aria-live="polite"><h3>酸茶知识推荐</h3>${r.kind==='loose_tea'?'':`<h4>${titles[r.kind]}</h4>`}<p>${esc(r.description)}</p>
  ${r.candidates.length?`<p>请对照实物确认一款，再生成知识卡。</p><div class="vision-candidates">${r.candidates.map(c=>{const p=TEA_DATA.products.find(x=>x.id===c.product_id);return `<article><img loading="lazy" decoding="async" src="${p.image}" alt="${esc(p.name)}候选参考"><div><span class="tag">${c.strength==='label_and_visual'?'文字与外观线索':'仅外观相似'}</span><h4>${esc(p.name)}</h4><p>${esc(c.evidence)}</p><button class="secondary" data-vconfirm="${p.id}">确认此图鉴条目</button></div></article>`}).join('')}</div>`:'<button class="secondary" id="vision-general">查看酸茶通识</button>'}</section>`;
}
function identify(){

  return header('AI识茶')+`<section class="vision-hero"><div><span class="eyebrow">SEE THE TEA · KNOW ITS STORY</span><h1>拍一拍，认识酸茶</h1><p>从一张照片，走进一片茶叶的故事。</p><span class="vision-method">多模态视觉理解 ＋ 知识库匹配</span></div><div class="vision-lens" aria-hidden="true">茶<span>SCAN & DISCOVER</span></div></section>

    <input hidden type="file" id="vision-file" accept="image/jpeg,image/png,image/webp"><input hidden type="file" id="vision-camera" accept="image/*" capture="environment">
    <div class="actions"><button class="secondary" id="vision-choose">上传图片</button><button class="secondary" id="vision-take">拍一张</button>${s.image?'<button class="text-btn" id="vision-clear">移除图片</button>':''}</div><p class="subtle">JPEG / PNG / WebP，最大10MB。建议拍清楚正面包装与产品名称；手机拍照选项由设备支持决定。</p>
    ${s.filename?`<p class="vision-file-name">${esc(s.filename)}</p>`:''}
    <label class="vision-consent"><input id="vision-consent" type="checkbox" ${s.consent?'checked':''}>开始识别时，将这张图片及图鉴参考图发送至豆包服务分析，可能消耗账户额度。图片不加入图鉴，也不保存在本网页。</label>
    ${s.requiresAccessCode?`<label class="field">识茶访问码<input class="search" id="vision-access" type="password" autocomplete="off" value="${esc(s.accessCode)}" placeholder="请输入维护者提供的访问码"></label>`:''}
    <div class="actions"><button class="primary" id="vision-start" ${s.busy||s.loading||s.connecting?'disabled':''}>${s.loading?'正在准备图片…':s.connecting?'正在连接识图服务…':s.busy?'正在观察与匹配…':'开始AI识茶 ↗'}</button>${s.busy?'<button class="secondary" id="vision-cancel">取消</button>':''}</div>
    <p class="vision-service" role="status">${esc(visionStatusLabel())} <button class="text-btn" id="vision-recheck">重新检查</button></p>${s.error?`<p class="vision-error" role="alert">${esc(s.error)}</p>`:''}
  </section><aside class="vision-guide"><span class="eyebrow">A GOOD PHOTO HELPS</span><h2>让茶被看清</h2><p><b>① 拍正面</b><br>让名称与包装一起入镜。</p><p><b>② 光线匀</b><br>避开反光，先擦一擦镜头。</p><p><b>③ 看结果</b><br>相似外观可能属于不同产品，请确认后查看知识卡。</p><div class="vision-guide-note">不凭照片推断产地、年份、功效或真伪。匹配不到时，会明确告诉你。</div><button class="text-btn" id="vision-browse">先从图鉴认识一款 ↘</button></aside></div>
  ${visionResults()}${visionKnowledgeCard()}
  <details class="vision-manual" id="vision-manual" ${s.service==='ready'?'':'open'}><summary>从图鉴手动选择 · 无需AI也能浏览知识卡</summary><p class="subtle">这里是手动选择，不进行图片识别。知识卡会明确标注生成方式。</p><div class="vision-picker">${TEA_DATA.products.map(p=>`<button data-vselect="${p.id}"><img loading="lazy" src="${p.image}" alt="${esc(p.name)}"><span>${esc(p.name)}</span><small>${esc(p.category)}</small></button>`).join('')}</div></details>`+footer();

function cancelVision(){visionState.epoch++;visionState.controller?.abort();visionState.controller=null;visionState.busy=false;visionState.loading=false;}
function clearVision(){cancelVision();Object.assign(visionState,{image:'',filename:'',result:null,card:null,error:'',consent:false});if(page==='identify')render();}
async function prepareVisionImage(file){
  if(!file)return;
  cancelVision();const epoch=visionState.epoch;
  Object.assign(visionState,{image:'',filename:'',result:null,card:null,error:'',consent:false});
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)){visionState.error='请选择JPEG、PNG或WebP图片；其他相机格式请先转换。';render();return;}
  if(file.size>10*1024*1024){visionState.error='图片超过10MB，请换一张较小的照片。';render();return;}
  visionState.loading=true;render();
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();img.src=url;await img.decode();
    if(epoch!==visionState.epoch)return;
    if(!img.naturalWidth||img.naturalWidth*img.naturalHeight>50000000)throw Error('图片尺寸过大，请缩小后再试');
    const ratio=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
    const canvas=document.createElement('canvas');canvas.width=Math.round(img.naturalWidth*ratio);canvas.height=Math.round(img.naturalHeight*ratio);
    const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
    const image=canvas.toDataURL('image/jpeg',.86);
    if(image.length>5*1024*1024)throw Error('图片仍然过大，请换一张较小的照片');
    visionState.image=image;visionState.filename=file.name;
  }catch(e){if(epoch===visionState.epoch)visionState.error=e.message==='The source image cannot be decoded.'?'图片无法读取，请换一张照片':e.message;}
  finally{URL.revokeObjectURL(url);if(epoch===visionState.epoch){visionState.loading=false;if(page==='identify')render();}}
}
async function startVision(){
  const s=visionState;if(s.busy||s.loading||s.connecting)return;
  if(!s.image){s.error='请先点击“上传图片”或“拍一张”，选择要识别的照片。';render();return;}
  if(!s.consent){s.error='请先勾选上方的图片分析授权选项，再点击开始识别。';render();$('#vision-consent')?.focus();return;}
  if(s.service!=='ready'){
    s.connecting=true;s.error='';render();
    try{await checkVisionService();}finally{s.connecting=false;}
    if(s.service!=='ready'){s.error=s.service==='unconfigured'?'识图服务尚未配置，请联系维护者。':'暂时连不上识图后台。图片已保留，请稍后再次点击开始识别。';render();return;}
    if(!s.image||!s.consent)return;
  }
  cancelVision();const epoch=s.epoch,controller=new AbortController();s.controller=controller;s.busy=true;s.error='';s.result=null;s.card=null;render();
  const timer=setTimeout(()=>controller.abort('timeout'),70000);
  try{
    const r=await fetch(visionEndpoint()+'/api/vision/recognize',{method:'POST',headers:{'Content-Type':'application/json',...(s.accessCode?{Authorization:'Bearer '+s.accessCode}:{})},body:JSON.stringify({image:s.image}),signal:controller.signal});
    let result;try{result=await r.json()}catch{throw Error('识茶服务没有返回可用结果，请稍后重试')}
    if(!r.ok)throw Error(result.error||'暂时无法识别，请稍后重试');
    if(epoch!==s.epoch)return;s.result=TeaVisionCore.normalizeResult(result,TEA_DATA.products);s.card=TeaVisionCore.card(TEA_DATA,null,'general');
  }catch(e){if(epoch===s.epoch)s.error=controller.signal.aborted?'识别已取消或超时，可重新尝试。':e.message;}
  finally{clearTimeout(timer);if(epoch===s.epoch){s.busy=false;s.controller=null;if(page==='identify')render();}}
}
function chooseVisionProduct(id,mode='manual'){
  cancelVision();
  try{visionState.card=TeaVisionCore.card(TEA_DATA,id,mode,visionState.result);visionState.error='';if(mode!=='ai')visionState.result=null;
    $('#detail').close();if(page!=='identify'){page='identify';location.hash='identify'}render();setTimeout(()=>$('#vision-card')?.scrollIntoView({behavior:'smooth',block:'start'}),40);
  }catch(e){visionState.error=e.message;if(page==='identify')render();}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[id="vision-drop"]');if(!b)return;
  if(b.id==='vision-choose'||b.id==='vision-drop')$('#vision-file')?.click();
  if(b.id==='vision-take')$('#vision-camera')?.click();
  if(b.id==='vision-clear'||b.id==='vision-again'){clearVision();$('#vision-drop')?.scrollIntoView({behavior:'smooth'});}
  if(b.id==='vision-start')startVision();
  if(b.id==='vision-cancel'){cancelVision();render();}
  if(b.id==='vision-recheck'){visionState.service='checking';render();checkVisionService();}
  if(b.dataset.vselect)chooseVisionProduct(b.dataset.vselect);
  if(b.dataset.vconfirm)chooseVisionProduct(b.dataset.vconfirm,'ai');
  if(b.id==='vision-general')chooseVisionProduct(null,'general');
  if(b.id==='vision-browse'){const d=$('#vision-manual');d.open=true;d.scrollIntoView({behavior:'smooth'});}
  if(b.id==='vision-export'&&visionState.card)download('德昂茶语-酸茶知识卡.txt',TeaVisionCore.exportText(visionState.card));
});
document.addEventListener('change',e=>{
  if(['vision-file','vision-camera'].includes(e.target.id))prepareVisionImage(e.target.files[0]);
  if(e.target.id==='vision-consent'){visionState.consent=e.target.checked;const b=$('#vision-start');if(b)b.disabled=visionState.busy||visionState.loading||visionState.connecting;}
});
document.addEventListener('input',e=>{if(e.target.id==='vision-access')visionState.accessCode=e.target.value;});
document.addEventListener('keydown',e=>{if(e.target.id==='vision-drop'&&['Enter',' '].includes(e.key)){e.preventDefault();$('#vision-file').click();}});
document.addEventListener('dragover',e=>{if(e.target.closest('#vision-drop'))e.preventDefault();});
document.addEventListener('drop',e=>{if(e.target.closest('#vision-drop')){e.preventDefault();prepareVisionImage(e.dataTransfer.files[0]);}});
window.addEventListener('hashchange',()=>{if(location.hash!=='#identify'&&(visionState.busy||visionState.loading))cancelVision();});
checkVisionService();

// Identity selection controls the interface; it is not server-side authentication.
const teaRoles=[['public','初次接触酸茶的公众','从一杯酸茶开始认识德昂文化'],['student','青年学生','探索酸茶知识与非遗文化'],['enthusiast','茶文化爱好者','了解酸茶工艺与茶文化'],['visitor','文化旅游访客','循着茶香，走近德昂'],['manager','酸茶管理者','浏览全部内容，开展传播创作']];
let teaIdentity=read('tea-identity',null);
if(!teaRoles.some(r=>r[0]===teaIdentity))teaIdentity=null;
const teaFullNav=nav.map(r=>r.slice()),teaOriginalRender=render;
function teaLogin(){return `<section class="tea-login"><span class="eyebrow">DE'ANG TEA MEMORY</span><h1>欢迎来到德昂茶语</h1><p>请选择你的身份，开启酸茶之旅</p><div class="tea-role-list">${teaRoles.map(([id,name,description])=>`<button class="tea-role" data-tea-role="${id}"><span><strong>${name}</strong><small>${description}</small></span><span aria-hidden="true">↗</span></button>`).join('')}</div><p class="tea-login-note">无需注册，选择身份即可进入</p></section>`}
render=function(){
 const loggedIn=Boolean(teaIdentity),manager=teaIdentity==='manager';

 if(page==='creative'&&!manager){page='home';location.hash='home';}
 teaOriginalRender();
 $('#main').innerHTML=`<div class="tea-identity-bar"><span>${esc(teaRoles.find(r=>r[0]===teaIdentity)[1])}</span><button class="text-btn" data-tea-switch>切换身份</button></div>`+$('#main').innerHTML;
};
document.addEventListener('click',e=>{
 const roleButton=e.target.closest('[data-tea-role]');
 if(roleButton&&teaRoles.some(r=>r[0]===roleButton.dataset.teaRole)){
  teaIdentity=roleButton.dataset.teaRole;save('tea-identity',teaIdentity);page='home';location.hash='home';render();window.scrollTo(0,0);
 }
 if(e.target.closest('[data-tea-switch]')){teaIdentity=null;save('tea-identity',null);page='home';location.hash='home';render();window.scrollTo(0,0);}

window.addEventListener('hashchange',()=>{page=location.hash.slice(1)||'home';render();window.scrollTo(0,0)});page=location.hash.slice(1)||'home';render();
</script><script>// Loaded only by the API-backed page. The standalone free HTML stays local.
const originalTeaChat=chat;
chat=function(){return originalTeaChat().replace('依据已有资料检索作答；未核实的内容不作为答案。','问茶由DeepSeek结合知识库回答。发送的问题与相关资料将交由DeepSeek处理；没有匹配资料时由AI直接回答，并标注未经知识库核实。')};
ask=async function(q){
 if(busy||typeof q!=='string'||!q.trim())return;
 q=q.trim();if(q.length>600){toast('问题请控制在600字以内');return}
 busy=true;messages.push({role:'user',text:q});if(page!=='chat'){location.hash='chat';page='chat'}render();
 try{
  let r;
  try{
   const access=typeof visionState!=='undefined'?visionState.accessCode:'';
   const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json',...(access?{Authorization:'Bearer '+access}:{})},body:JSON.stringify({question:q}),signal:teaTimeoutSignal(70000)});
   r=await response.json();if(!response.ok)throw Error(r.error||'问茶服务暂不可用');
   if(typeof r.answer!=='string'||!Array.isArray(r.sources))throw Error('回答格式错误');
  }catch(e){r=TeaEngine.answer(q,TEA_DATA.records);r.notice=(e.name==='TimeoutError'?'DeepSeek请求超时':e.message)+'；以下为本地资料检索结果，未生成AI回答。'}
  messages.push({role:'assistant',text:r.answer,mode:r.mode,sources:r.sources,notice:r.notice});messages=messages.slice(-40);save('tea-messages',messages);
 }finally{busy=false;if(page==='chat'){render();$('#chat-input').focus();$('#chat-form').scrollIntoView({block:'end',behavior:'smooth'})}}
};
if(page==='chat')render();
